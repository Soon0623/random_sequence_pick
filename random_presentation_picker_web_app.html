<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Presentation Order Picker</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { margin: 10px 0; padding: 10px; }
    .group { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Random Presentation Order Picker</h1>

  <input type="file" id="fileInput" accept=".xlsx" />
  <br>
  <button onclick="processFile()">Generate Groups</button>

  <div id="output"></div>

  <script>
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function processFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert('Please upload an Excel file.');
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        // Assume first column contains student IDs
        let students = json.map(row => row[0]).filter(v => v);

        if (students.length !== 40) {
          alert('Student count must be 40. Current: ' + students.length);
          return;
        }

        students = shuffle(students);

        const group1 = students.slice(0, 13);
        const group2 = students.slice(13, 26);
        const group3 = students.slice(26);

        display(group1, group2, group3);
      };

      reader.readAsArrayBuffer(file);
    }

    function display(g1, g2, g3) {
      const output = document.getElementById('output');

      function makeGroup(title, group) {
        let html = `<div class="group"><h2>${title}</h2><ol>`;
        group.forEach(s => {
          html += `<li>${s}</li>`;
        });
        html += '</ol></div>';
        return html;
      }

      output.innerHTML =
        makeGroup('Group 1 (13)', g1) +
        makeGroup('Group 2 (13)', g2) +
        makeGroup('Group 3 (14)', g3);
    }
  </script>
</body>
</html>
